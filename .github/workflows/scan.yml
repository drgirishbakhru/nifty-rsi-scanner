name: Monthly RSI scan

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 16:30 IST, Monday to Friday
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan all NSE stocks
        env:
          TZ: Asia/Kolkata
        run: python scanner.py --dashboard docs/data

      - name: Commit results
        run: |
          git config user.name "rsi-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Scan $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push
